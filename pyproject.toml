[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colabalign"
version = "1.2.0"
description = "All-vs-all US-align protein structure comparison, structural dendrograms, clustering and cluster-representative selection."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christopher R. Field" }]
requires-python = ">=3.14,<3.15"
# USalign, BeEM and TreeCluster.py are also required at runtime. USalign and
# BeEM are not pip-installable; `conda install -c conda-forge -c bioconda
# colabalign` installs everything.
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "biopython==1.88",
    "scipy==1.18.1",
    "tqdm==4.70.1",
    "treecluster==1.0.5",
]
keywords = ["protein structure", "structural alignment", "TM-score", "US-align", "dendrogram", "clustering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
release = ["build==1.6.1", "pip==26.2.2", "setuptools==84.2.1", "wheel==0.48.0"]

[project.urls]
Homepage = "https://github.com/crfield18/ColabAlign"
Source = "https://github.com/crfield18/ColabAlign"
Paper = "https://doi.org/10.1101/2025.10.06.677802"
Code-DOI = "https://doi.org/10.5281/zenodo.14169501"

[project.scripts]
colabalign = "colabalign.pipeline:main"

[tool.setuptools]
packages = ["colabalign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
